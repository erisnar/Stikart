name: Validate and merge race submission

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

jobs:
  validate:
    if: startsWith(github.head_ref, 'add-race/') || startsWith(github.head_ref, 'edit-race/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find new GPX files
        run: |
          git diff --name-only origin/main...HEAD -- '*.gpx' > /tmp/new_gpx.txt
          echo "GPX files in this PR:"
          cat /tmp/new_gpx.txt

      - name: Validate GPX files
        id: validate
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 - << 'PYEOF'
          import sys, os, math
          from pathlib import Path
          from xml.etree import ElementTree as ET

          MIN_KM = 10

          def haversine(lat1, lon1, lat2, lon2):
              R = 6371
              lat1, lon1, lat2, lon2 = map(math.radians, [lat1, lon1, lat2, lon2])
              dlat, dlon = lat2 - lat1, lon2 - lon1
              a = math.sin(dlat/2)**2 + math.cos(lat1)*math.cos(lat2)*math.sin(dlon/2)**2
              return 2 * R * math.asin(math.sqrt(a))

          errors = []
          total_km = 0

          with open('/tmp/new_gpx.txt') as f:
              files = [l.strip() for l in f if l.strip().endswith('.gpx')]

          if not files:
              if not os.environ.get('HEAD_REF', '').startswith('edit-race/'):
                  print("ERROR: No GPX files found in this PR")
                  sys.exit(1)

              # Edit PR with no new GPX: worker.js always prepends the updated entry
              # right after the raceRoutes marker, so validate that entry directly
              # from the current file rather than the diff (a partial-field edit's
              # diff omits unchanged fields like name/date/category entirely).
              import re
              from datetime import datetime

              VALID_CATEGORIES = {'short-trail', 'marathon-trail', '50k', '50-miles', '100k', '100-miles', '100-miles-plus'}

              try:
                  with open('js/races.js', encoding='utf-8') as f:
                      races_js = f.read()
              except Exception as e:
                  print(f"ERROR: could not read js/races.js: {e}")
                  sys.exit(1)

              marker = 'const raceRoutes = ['
              marker_idx = races_js.find(marker)
              if marker_idx == -1:
                  print("ERROR: could not find raceRoutes array in js/races.js")
                  sys.exit(1)

              depth = 0
              entry_start = entry_end = None
              i = marker_idx + len(marker)
              while i < len(races_js):
                  c = races_js[i]
                  if c == '{':
                      if depth == 0:
                          entry_start = i
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          entry_end = i + 1
                          break
                  i += 1

              if entry_start is None or entry_end is None:
                  print("ERROR: could not locate first race entry in js/races.js")
                  sys.exit(1)

              added = races_js[entry_start:entry_end]
              entry_errors = []

              name_m = re.search(r'''name:\s*["']([^"']+)["']''', added)
              if not name_m or not name_m.group(1).strip():
                  entry_errors.append("name is missing or empty")
              else:
                  print(f"  Name: {name_m.group(1)}")

              date_m = re.search(r'''date:\s*["'](\d{4}-\d{2}-\d{2})["']''', added)
              if not date_m:
                  entry_errors.append("date is missing or not in YYYY-MM-DD format")
              else:
                  try:
                      datetime.strptime(date_m.group(1), '%Y-%m-%d')
                      print(f"  Date: {date_m.group(1)}")
                  except ValueError:
                      entry_errors.append(f"date '{date_m.group(1)}' is not a valid calendar date")

              cat_m = re.search(r'''category:\s*["']([^"']+)["']''', added)
              if not cat_m:
                  entry_errors.append("category is missing")
              elif cat_m.group(1) not in VALID_CATEGORIES:
                  entry_errors.append(f"category '{cat_m.group(1)}' is invalid (must be one of: {', '.join(sorted(VALID_CATEGORIES))})")
              else:
                  print(f"  Category: {cat_m.group(1)}")

              url_m = re.search(r'''url:\s*["']([^"']+)["']''', added)
              if url_m and not url_m.group(1).startswith(('http://', 'https://')):
                  entry_errors.append(f"url must start with http:// or https://")

              gpx_refs = re.findall(r'''["']([^"']+\.gpx)["']''', added)
              if not gpx_refs:
                  entry_errors.append("no GPX file references found in updated entry")
              for gp in gpx_refs:
                  if not Path(gp).exists():
                      entry_errors.append(f"referenced GPX file not found in repo: {gp}")
                  else:
                      print(f"  GPX exists: {gp} ✓")

              if entry_errors:
                  for e in entry_errors:
                      print(f"ERROR: {e}")
                  sys.exit(1)

              print("Entry data validation passed ✓")
              sys.exit(0)

          for path in files:
              if not Path(path).exists():
                  errors.append(f"{path}: file not found")
                  continue
              try:
                  tree = ET.parse(path)
                  root = tree.getroot()
                  points = root.findall('.//{*}trkpt')
                  if not points:
                      errors.append(f"{path}: no track points (<trkpt>) found — use a track file, not a route file")
                      continue
                  coords = [(float(p.get('lat')), float(p.get('lon'))) for p in points]
                  km = sum(
                      haversine(coords[i][0], coords[i][1], coords[i+1][0], coords[i+1][1])
                      for i in range(len(coords) - 1)
                  )
                  total_km += km
                  print(f"  {path}: {km:.1f} km, {len(points)} track points ✓")
              except ET.ParseError as e:
                  errors.append(f"{path}: invalid XML — {e}")

          print(f"\nTotal distance: {total_km:.1f} km")

          if errors:
              for e in errors:
                  print(f"ERROR: {e}")
              sys.exit(1)

          if total_km < MIN_KM:
              # Loop race: check if app.js diff contains manualDistance >= MIN_KM
              import subprocess, re
              try:
                  diff = subprocess.check_output(
                      ['git', 'diff', '--unified=0', 'origin/main...HEAD', '--', 'js/races.js']
                  ).decode('utf-8', errors='replace')
                  added = [float(m) for m in re.findall(r'^\+\s*manualDistance:\s*(\d+(?:\.\d+)?)', diff, re.MULTILINE)]
                  if added and max(added) >= MIN_KM:
                      print(f"  Loop course — GPX = {total_km:.1f} km, manualDistance = {max(added):.0f} km ✓")
                  else:
                      print(f"ERROR: total distance {total_km:.1f} km is less than {MIN_KM} km and no valid manualDistance found")
                      sys.exit(1)
              except Exception as e:
                  print(f"ERROR: could not check manualDistance: {e}")
                  sys.exit(1)

          print("Validation passed ✓")
          PYEOF
        continue-on-error: true

      - name: Comment validation result
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.validate.outcome }}' === 'success';
            const body = passed
              ? '✅ **Validering OK** — Merger automatisk!'
              : '❌ **Validering feilet** — Se logg for detaljer.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Auto-merge if valid
        if: steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
